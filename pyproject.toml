[project]
name = "armi-workspace"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis==6.163.0",
    "playwright==1.61.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
]

[tool.uv]
package = false
build-constraint-dependencies = ["hatchling==1.31.0", "uv_build==0.11.33"]

[tool.uv.workspace]
members = [
    "packages/armi-kernel",
    "packages/armi-artifact-store",
    "packages/armi-postgresql-contract",
    "packages/armi-channel-napcat",
    "packages/armi-adapter-qq",
    "packages/armi-adapter-esp32-display",
    "packages/armi-runtime-foundation",
    "modules/capability",
    "modules/relationship",
    "modules/memory",
    "modules/sleep",
    "modules/activity",
    "modules/material",
    "modules/subject-state",
    "modules/mood",
    "modules/prompt",
    "modules/evidence",
    "modules/interaction",
    "modules/attention",
    "modules/context",
    "modules/expression",
    "modules/effect",
    "modules/web-observation",
    "modules/codex",
    "modules/data-rights",
    "modules/experience",
    "modules/cognition",
    "modules/perception",
    "modules/live-voice",
    "modules/live-vision",
    "apps/armi-runtime",
    "apps/armi-admin",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
asyncio_mode = "strict"
markers = [
    "creator_system: requires wheel, isolated PostgreSQL, and pinned Chromium",
    "postgresql: requires the isolated PostgreSQL integration environment",
]
norecursedirs = [".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "node_modules", "venv", "src"]
testpaths = [
    "tests",
    "modules",
    "apps",
    "packages",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".armi-tools", ".tmp", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
