[project]
name = "armi-workspace"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis==6.163.0",
    "playwright==1.61.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
]

[tool.uv]
package = false
build-constraint-dependencies = ["uv_build==0.11.33"]

[tool.uv.workspace]
members = [
    "packages/armi-kernel",
    "packages/armi-postgresql-contract",
    "apps/armi-runtime",
    "apps/armi-admin",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".armi-tools", ".tmp", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
