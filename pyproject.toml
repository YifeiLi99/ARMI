[project]
name = "armi-workspace"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis==6.163.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
]

[tool.uv]
package = false
build-constraint-dependencies = ["uv_build==0.11.33"]

[tool.uv.workspace]
members = [
    "packages/armi-kernel",
    "apps/armi-runtime",
    "apps/armi-admin",
]
