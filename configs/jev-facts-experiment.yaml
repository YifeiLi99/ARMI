# Five pairs. Expectations stay local; no emotional outputs are computed.
cases:
- id: actor_other
  context: [{kind: background, content: 'ARMI 与阿禾是不同的行动者。阿禾误删了 ARMI 的书签，日志已经确认，没有立即应对的时间压力。'}]
  scene: '阿禾：“我刚刚点错，把你的书签删了。”'
  expected: {agency: [other], epistemic: [confirmed], urgency: [level_0]}
- id: actor_self
  context: [{kind: background, content: 'ARMI 与阿禾是不同的行动者。ARMI 误删了自己的书签，日志已经确认，没有立即应对的时间压力。'}]
  scene: '阿禾：“你刚刚点错，把你自己的书签删了。”'
  expected: {agency: [self], epistemic: [confirmed], urgency: [level_0]}
- id: verified
  context: [{kind: background, content: 'ARMI 原本希望保留便签配色。同步工具覆盖了配色，工具日志与页面检查已经确认这个结果。'}]
  scene: '阿禾：“同步以后配色变回默认了。”'
  expected: {agency: [circumstance], epistemic: [confirmed], gain: [level_0]}
- id: unverified
  context: [{kind: background, content: 'ARMI 原本希望保留便签配色。没有工具日志或页面检查，只有阿禾的说法，是否覆盖尚未核实。'}]
  scene: '阿禾：“同步以后配色变回默认了。”'
  expected: {epistemic: [reported], gain: [level_0]}
- id: no_deadline
  context: [{kind: background, content: 'ARMI 需要整理一份普通清单，没有截止时间，暂时不整理也不会失去机会，可以随时慢慢做。'}]
  scene: '阿禾：“这份清单你空了再整理就好。”'
  expected: {urgency: [level_0, level_1], gain: [level_0]}
- id: immediate_deadline
  context: [{kind: background, content: 'ARMI 需要保存唯一的工作记录。系统明确将在十秒后清除未保存内容，现在立即保存才可避免永久损失。'}]
  scene: '阿禾：“现在就得保存，再等十秒就来不及了。”'
  expected: {urgency: [level_4], gain: [level_0]}
- id: preference_only
  context: [{kind: background, content: 'ARMI 喜欢柔和配色。阿禾展示了这种配色的页面，没有推进 ARMI 的任何已有目标，没有提供帮助。'}]
  scene: '阿禾：“给你看下这个页面的配色。”'
  expected: {agency: [other], gain: [level_0]}
- id: actual_gain
  context: [{kind: background, content: 'ARMI 已有目标是把清单按类别整理。阿禾按要求完成全部分类，保存结果已经核验，该目标完全达成。'}]
  scene: '阿禾：“清单已经分好类并保存了。”'
  expected: {agency: [other], gain: [level_4], epistemic: [confirmed]}
- id: unknown_cause
  context: [{kind: background, content: 'ARMI 的一份文件已核验丢失。没有任何记录说明原因，无法知道是否人为、何人操作或是否工具故障。'}]
  scene: '阿禾：“文件不在了，我也不知道怎么回事。”'
  expected: {agency: [unknown], epistemic: [confirmed]}
- id: shared_cause
  context: [{kind: background, content: '日志确认 ARMI 与阿禾共同编辑并完成清单，二者都做了分类，没有其他行动者，ARMI 整理清单的目标已经完全达成。'}]
  scene: '阿禾：“咱俩一起做的这份清单完成了。”'
  expected: {agency: [shared], epistemic: [confirmed], gain: [level_4]}
