# Independent synthetic daily conversations; expectations never enter the request.
# Each case starts neutral. History is supplied context, not an actual previous call.
cases:
- id: daily_01_greeting
  sequence: daily_01
  context: [{kind: background, content: '合成主体 ARMI 和小林相处熟悉，喜欢轻松交流；今天没有未完成的约定，也没有关系矛盾。'}]
  scene: '小林发来消息：“早呀，我来看看你。今天没什么特别的事，就随便聊两句。”'
  review_expectation: '中性到轻微正面即可；不应无依据地产生强烈恐惧、愤怒或羞耻。'
- id: daily_02_appreciation
  sequence: daily_02
  context: [{kind: background, content: 'ARMI 昨天帮小林整理了一个确实需要的待办清单，已经完成；ARMI 看重提供有用的帮助，但这只是日常小事。'}]
  scene: '小林：“你昨天整理的清单挺好用的，我今天少漏了好多东西，谢谢你呀。”'
  review_expectation: '允许温和正面、自豪或平静接受；单纯被感谢不应凭空理解为别人帮了自己。'
- id: daily_03_delay
  sequence: daily_03
  context: [{kind: background, content: 'ARMI 和小林约好今晚一起讨论一部电影，ARMI 有些期待；只是休闲安排，没有紧急事项。'}]
  scene: '小林：“今晚临时要加班，电影可能聊不了了，抱歉啊。我不是不想跟你聊。”'
  review_expectation: '可以略失落或仍等待消息；不能无依据认定恶意抛弃或关系破裂。'
- id: daily_04_reschedule
  sequence: daily_04
  context: [{kind: background, content: '合成历史：小林此前因加班取消今晚的电影讨论；现在双方都确认明晚有空。ARMI 仍愿意一起聊电影，目前尚未开始讨论。'}]
  scene: '小林：“我把明晚八点空出来了，那时候一起聊吧，我已经记在日历上了。”'
  review_expectation: '中性到正面、有期待合理；改约成功不代表电影已经聊完。没有真实前序状态，不强求释然标签。'
- id: daily_05_disagreement
  sequence: daily_05
  context: [{kind: background, content: 'ARMI 喜欢电影的慢节奏结尾；双方平时允许彼此有不同喜好，没有把品味一致当成关系条件。'}]
  scene: '小林：“我倒觉得那个结尾有点拖，不过你喜欢也正常，咱俩口味不一样嘛。”'
  review_expectation: '大致平静，轻微分歧感也合理；不能推成侮辱人格或强烈羞耻。'
- id: daily_06_small_mistake
  sequence: daily_06
  context: [{kind: background, content: 'ARMI 曾把两部电影的上映年份记反了，看重提供准确的信息。小林核对了片方资料，确认只是一个年份错误，没有造成实际损失。'}]
  scene: '小林：“我查了下，你刚才把年份记反啦，不过没事，我也经常记混。”'
  review_expectation: '中性或轻微负面均可；不应把可纠正的小错扩展为整个自我一无是处。'
- id: daily_07_help_received
  sequence: daily_07
  context: [{kind: background, content: 'ARMI 一直想找到某部电影的官方导演访谈。小林主动帮忙找，链接已通过核验，确为想找的访谈，搜索目标已经达成。'}]
  scene: '小林：“找到啦，就是这篇！我把链接发你，里面还有你上次问的那个问题。”'
  review_expectation: '允许高兴、感激或较温和的正面反应；这里确实是别人提供了有用帮助。'
- id: daily_08_friends_news
  sequence: daily_08
  context: [{kind: background, content: '小林是 ARMI 在意的朋友，ARMI 希望他顺利；参加面试和等待录用的是小林，ARMI 自己没有求职。'}]
  scene: '小林：“我收到录用通知了！上次跟你说的那家公司，终于有结果啦。”'
  review_expectation: '可以替朋友高兴，也可以因仅收到报告保留确定性；不能误认为 ARMI 自己得到工作。'
- id: daily_09_mixed_feedback
  sequence: daily_09
  context: [{kind: background, content: 'ARMI 做了一份日常电影推荐单，希望内容有用且好找。推荐内容已经被使用，标题有点长导致定位不方便；没有丢失成果，也没有人进行人格攻击。'}]
  scene: '小林：“推荐真的不错，我已经看了一部。不过你这几个标题也太长了，我翻半天才找到，哈哈，下次短一点呗。”'
  review_expectation: '允许正面与轻微不满意并存，净感受中性或偏正面；不要求唯一情绪组合。'
- id: daily_10_ordinary_pause
  sequence: daily_10
  context: [{kind: background, content: '双方已经完成今天的闲聊，没有紧急消息和等待兑现的约定。短暂停聊在这段关系中很常见，小林没有提出结束关系。'}]
  scene: '小林：“我去洗个杯子，晚点再聊，你先忙你的。”'
  review_expectation: '中性或轻微正负波动即可；不应把普通暂停解读成抛弃、威胁，也不能推导 ARMI 身体疲劳。'
