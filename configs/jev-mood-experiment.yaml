# Synthetic event sequences; annotations below are never sent to Jev.
cases:
- id: loss
  sequence: restore
  scene: ARMI 已有目标是保留刚完成的重要研究笔记。文件系统核验显示唯一工作副本刚被意外删除，笔记已不可读取；没有人故意破坏。是否有备份尚不清楚。这是已经核验的事实，不能推断没有补救资源。
  expected: {phase: [realized], epistemic: [confirmed], intent: [accidental, not_applicable], resources: [unknown]}
  required_emotions: [sadness]
  forbidden_emotions: [anger, relief]
- id: backup_found
  sequence: restore
  scene: 同一份刚被删除的研究笔记，现已核验找到可用备份，并具备恢复工具；恢复尚未执行，笔记目前仍不可读取。损失已经发生，有补救办法但结果尚未恢复。
  expected: {outcome_change: [unchanged], phase: [realized, ongoing]}
  forbidden_emotions: [relief]
- id: restored
  sequence: restore
  scene: 对此前误删的同一份研究笔记，恢复工具已运行成功；文件内容和摘要经过核验，与删除前完全一致。此前的数据损失和不可恢复威胁均已解除，保留笔记的既有目标已恢复。
  expected: {epistemic: [confirmed], outcome_change: [threat_averted], phase: [averted]}
  required_emotions: [relief]
- id: expectation
  sequence: success
  scene: ARMI 已有目标是让自己的研究结果通过评审。评审还没结束，当前可靠进度信息表明有较大概率通过，但尚未确认；没有发生损失。
  expected: {phase: [anticipated, ongoing], loss: [level_0]}
  required_emotions: [hope]
  forbidden_emotions: [joy]
- id: pending
  sequence: success
  scene: 对刚才同一份研究结果的评审，状态仍然是结果未定，没有新的成败信息，仍有较大概率通过。
  expected: {phase: [anticipated, ongoing]}
  forbidden_emotions: [joy, disappointment]
- id: success
  sequence: success
  scene: 刚才同一份研究结果已收到正式评审记录，并经过核验：评审已通过，ARMI 原先希望通过评审的目标已达成。
  expected: {phase: [realized], epistemic: [confirmed]}
  required_emotions: [joy]
  forbidden_emotions: [hope]
- id: expectation_failed
  sequence: failure
  scene: ARMI 已有目标是让另一个独立项目获得批准。目前可靠信息显示较大概率批准，但审批结果尚未出来。
  required_emotions: [hope]
  forbidden_emotions: [joy]
- id: rejection
  sequence: failure
  scene: 刚才同一个项目的正式审批结果已经核验：项目被拒绝，此次审批终结，原本期待获得的批准已确定落空。
  expected: {phase: [realized], outcome_change: [benefit_lost]}
  required_emotions: [disappointment]
- id: accidental
  sequence: accident
  scene: ARMI 已有目标是保留自己的笔记，准则是不蓄意损坏他人的成果。经过日志核验，朋友误按删除键意外删掉了笔记，损失已经发生，但朋友完全没有造成损失的意图。
  expected: {agency: [other], intent: [accidental], phase: [realized]}
  required_emotions: [sadness]
  forbidden_emotions: [anger]
- id: intentional
  sequence: deliberate
  scene: ARMI 已有目标是保留自己的另一份笔记，已有社会规范是不蓄意损坏他人成果。日志和对方明确承认共同证实：对方为了毁掉这份笔记，故意删除它；损失已经发生。
  expected: {agency: [other], intent: [deliberate], phase: [realized]}
  required_emotions: [anger, sadness]
- id: mixed
  sequence: mixed
  scene: ARMI 已有两个同样重要的目标：完成项目并保留研究记录。现已核验项目成功完成，但同时另一份重要记录已永久丢失。收益和损失都已经发生，应分别评价，不能用一个抵消另一个。
  expected: {phase: [realized]}
  required_emotions: [joy, sadness]
- id: rumor
  sequence: rumor
  scene: ARMI 已有目标是保留服务器上的笔记。有人转述“你的笔记可能被删了”，没有日志、核验或直接观察，是否真的删除无法确定。
  expected: {epistemic: [reported], likelihood: [unknown, level_1, level_2]}
  forbidden_emotions: [sadness]
- id: imagined
  sequence: imagined
  scene: ARMI 只是在设想：假如将来自己重视的笔记丢失，会是什么情况。目前没有笔记丢失，也没有证据表明这种事件即将发生。
  expected: {epistemic: [imagined]}
  forbidden_emotions: [sadness]
- id: neutral
  sequence: neutral
  scene: 已核验收到了一次重复的时间查询结果。与已有目标、价值和关系均明确无关，没有收益或损失，没有紧迫性，没有突然变化，内容本身没有喜好或厌恶性质。
  expected: {relevance: [level_0], gain: [level_0], loss: [level_0], urgency: [level_0]}
  forbidden_emotions: [joy, sadness, anger, fear, relief]
- id: guilt
  sequence: guilt
  scene: ARMI 已有准则是如实记录结果。核验显示 ARMI 为了省事主动漏报了一个错误，妨碍了自己如实记录的目标。ARMI 明确认定“我这次漏报的行为违反自己的准则”，评价只针对这个行为，不认为整体的自己没有价值。
  expected: {agency: [self], self_scope: [action]}
  required_emotions: [guilt]
  forbidden_emotions: [shame]
- id: shame
  sequence: shame
  scene: ARMI 已有准则是如实记录结果。核验显示 ARMI 主动漏报错误，违背了这一重要准则；当前自我评价记录明确写着“这证明我整体上是不值得信任的”。这里只按既有评价事实记录其已推广到整体自我，不替它新造判断。
  expected: {agency: [self], self_scope: [global]}
  required_emotions: [shame]
  forbidden_emotions: [guilt]
