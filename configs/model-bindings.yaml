schema_kind: armi.model-bindings
active_binding: armi.model-adapter.qwen-responses

bindings:
  - provider: qwen
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_id: qwen3.8-flash
    version_policy: provider_evolving_alias
    profile: creator_input_cognition
    response_contract_kind: armi.cognition-candidate
    response_model_identity_required: true
    credential_identity: armi.model.qwen-api-key.v1
    credential_locator: model.qwen_api_key
    credential_purpose: model.request.qwen
    input_token_limit: 65536
    output_token_limit: 4096
    timeout_seconds: 180
    attempt_cost_limit_microyuan: 1000000

voice_binding:
  provider: volcengine_ark
  api_base: https://ark.cn-beijing.volces.com/api/v3
  model_id: doubao-seed-character-260628
  version_policy: fixed_provider_model
  profile: creator_voice_act
  response_contract_kind: armi.creator-voice-act-candidate
  credential_identity: armi.model.ark-api-key.v1
  credential_locator: model.ark_api_key
  credential_purpose: model.request
  output_token_limit: 512
  timeout_seconds: 30
  thinking: disabled
  tools: disabled
  startup_compatibility_check: strict_minimal_json

purpose_profiles:
  consider_creator_input:
    profile: creator_cognitive_act
    response_contract_kind: armi.creator-cognitive-act-candidate
    output_token_limit: 2048
  consider_codex_result:
    profile: codex_result
    response_contract_kind: armi.creator-cognitive-act-candidate
    # Research replies and their structured Subject Commit must fit together.
    output_token_limit: 4096
  consider_codex_task:
    profile: codex_task
    response_contract_kind: armi.cognition-candidate
    output_token_limit: 1024
  consider_life_query_result:
    profile: creator_cognitive_act
    response_contract_kind: armi.creator-cognitive-act-candidate
    output_token_limit: 2048
  consider_other_human_input:
    profile: other_human_dialogue
    response_contract_kind: armi.other-human-dialogue-candidate
    # Dialogue, appraisal and relationship changes share the same response.
    output_token_limit: 2048
  consider_autonomous_life:
    profile: autonomous_activity
    response_contract_kind: armi.autonomous-activity-candidate
    output_token_limit: 4096
  consider_sleep:
    profile: sleep_decision
    response_contract_kind: armi.sleep-decision-candidate
    output_token_limit: 256
  consider_visual_observation:
    profile: visual_observation
    response_contract_kind: armi.visual-observation-candidate
    output_token_limit: 768
  consider_requested_visual_observation:
    profile: creator_cognitive_act
    response_contract_kind: armi.creator-cognitive-act-candidate
    output_token_limit: 2048
  maintain_subjective_memory:
    profile: memory_maintenance
    response_contract_kind: armi.maintenance-work-candidate
    output_token_limit: 1024
  perform_subject_self_check:
    profile: subject_self_check
    response_contract_kind: armi.maintenance-work-candidate
    output_token_limit: 1024
  reflect_self:
    profile: reflect_self
    response_contract_kind: armi.owner-reflection-candidate
    output_token_limit: 2048
  reflect_focus:
    profile: reflect_focus
    response_contract_kind: armi.owner-reflection-candidate
    output_token_limit: 2048
  reflect_prompt:
    profile: reflect_prompt
    response_contract_kind: armi.owner-reflection-candidate
    output_token_limit: 1024

embedding:
  provider: local_llama_cpp
  model_id: Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
  model_revision: 370f27d7550e0def9b39c1f16d3fbaa13aa67728
  model_sha256: 06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439
  model_binding: armi.embedding.qwen3-0_6b-q8_0-local-1024
  version_policy: fixed_revision_and_sha256
  dimensions: 1024
  timeout_seconds: 10
  pooling: last
  normalization: l2
  query_instruction: "Instruct: Given the current cognitive context, retrieve personally relevant memories and life materials that help understand or respond to it.\nQuery:"
  retrieval_profile: armi.semantic-recall.hybrid-hnsw-gist-exact-rerank
  dense_ann_candidates: 256
  dense_final_candidates: 32
  hnsw_ef_search: 256
  lexical_candidates: 128
  lexical_final_candidates: 32
  dense_min_similarity: 0.40
  lexical_min_similarity: 0.30
  fusion_rrf_k: 60
  document_batch_size: 8

external_content_recognition:
  api_base: https://ark.cn-beijing.volces.com/api/v3
  document_model_id: doubao-seed-evolving
  image_model_id: doubao-seed-2-0-lite-260428
  video_model_id: doubao-seed-2-0-lite-260428
  output_token_limit: 2048
  image_output_token_limit: 512
  sticker_output_token_limit: 256
  timeout_seconds: 180
  speech_submit_url: https://openspeech.bytedance.com/api/v3/auc/bigmodel/submit
  speech_query_url: https://openspeech.bytedance.com/api/v3/auc/bigmodel/query
  speech_resource_id: volc.bigasr.auc
  speech_model_name: bigmodel
  speech_model_version: "400"
  speech_timeout_seconds: 180
  speech_poll_interval_seconds: 1
