# Local Creator-delegate interaction. Keep this separate from ARMI's Codex runner.
[mcp_servers.armi]
# Replace <USER> with the current user's profile name; TOML does not expand %LOCALAPPDATA%.
command = "C:/Users/<USER>/AppData/Local/Microsoft/WindowsApps/ARMI.exe"
args = ["mcp", "interaction"]
env_vars = ["ARMI_CLIENT_CONFIG"]
required = true
default_tools_approval_mode = "auto"
startup_timeout_sec = 10
tool_timeout_sec = 30
