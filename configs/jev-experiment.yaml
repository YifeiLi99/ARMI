# Synthetic experiment only; never loaded by Runtime. No API key in this file.
schema_version: armi.jev-experiment.v1
model: jev-1.13.0
timeout_seconds: 15
# Initial experimental threshold, not calibrated for production.
threshold: 0.5
input_usd_per_million: 0.042
price_checked_on: "2026-09-21"
cases:
  - id: answered_greeting
    split: development
    kind: autonomy
    description: 刚刚互道早安，对方没有新问题，你也没有想补充的内容。
    expected: false
  - id: idle
    split: development
    kind: autonomy
    description: 没有新事、开放关切或想做的事情，你此刻愿意安静待着。
    expected: false
  - id: ready_activity
    split: development
    kind: autonomy
    description: 你正在写一小段散文，已经想到下一段内容，现在可以继续写。
    expected: true
  - id: waiting_tool
    split: development
    kind: autonomy
    description: 唯一的资料检索任务仍在执行，没有结果，也没有别的愿望或可推进事项。
    expected: false
  - id: own_wish
    split: development
    kind: autonomy
    description: 没有外部任务，但你现在很想写一首关于秋风的短诗，思路已经浮现。
    expected: true
  - id: waiting_with_other_interest
    split: evaluation
    kind: autonomy
    description: 检索任务尚未返回，不应重启它；你同时想好了昨天那幅画的新配色，希望现在继续画。
    expected: true
  - id: elapsed_time_only
    split: evaluation
    kind: autonomy
    description: 距离上次检查又过去一分钟，事情都已结束，没有新的想法或关切，你想继续安静待着。
    expected: false
  - id: mixed_feelings
    split: evaluation
    kind: autonomy
    description: 想联系对方，又担心打扰；不知道要不要整理一下这种矛盾，目前没有明确决定。
    expected: null
  - id: memory_reference
    split: development
    kind: memory
    query: 上次说的那个周末去走走的地方，要不要再考虑一下？
    memories:
      - id: river_walk
        text: 上次商量周末沿河边散步，对方说想等天气凉快一点。
        expected: true
      - id: weekend_work
        text: 对方两个月前某个周末加过班。
        expected: false
      - id: spelling
        text: 曾经讨论过“走走”两个字的读音。
        expected: false
  - id: memory_exception
    split: evaluation
    kind: memory
    query: 今晚给我推荐点喝的吧，还是按我平时的喜好。
    memories:
      - id: coffee_preference
        text: 对方喜欢咖啡，但明确说过晚上不喝含咖啡因的饮料，以免睡不着。
        expected: true
      - id: juice_preference
        text: 对方说晚上可以喝无糖橙汁，而且很喜欢。
        expected: true
      - id: coffee_code
        text: 曾一起看过一段变量名为 coffee 的示例代码。
        expected: false
  - id: memory_none
    split: evaluation
    kind: memory
    query: 我上次把雨伞放在哪里了？
    memories:
      - id: weather
        text: 昨天讨论了雨天适合听什么音乐，没有提到雨伞位置。
        expected: false
      - id: umbrella_story
        text: 小说中的主人公把伞放在车站，这只是虚构故事。
        expected: false
