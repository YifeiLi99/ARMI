[project]
name = "armi-local-control"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "armi-kernel==0.0.0",
    "armi-interaction==0.0.0",
    "armi-context==0.0.0",
    "httpx==0.28.1",
    "psutil==7.2.2",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
]

[tool.uv.sources]
armi-kernel = { workspace = true }
armi-interaction = { workspace = true }
armi-context = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.33,<0.12"]
build-backend = "uv_build"
