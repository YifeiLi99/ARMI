[project]
name = "armi-adapter-qq"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "armi-channel-napcat==0.0.0",
    "armi-interaction==0.0.0",
    "armi-kernel==0.0.0",
    "fastapi==0.140.13",
]

[tool.uv.sources]
armi-channel-napcat = { workspace = true }
armi-kernel = { workspace = true }
armi-interaction = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.33,<0.12"]
build-backend = "uv_build"
