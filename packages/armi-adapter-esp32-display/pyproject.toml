[project]
name = "armi-adapter-esp32-display"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "armi-kernel==0.0.0",
    "armi-mood==0.0.0",
    "pyserial==3.5",
]

[tool.uv.sources]
armi-kernel = { workspace = true }
armi-mood = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.33,<0.12"]
build-backend = "uv_build"
