# Copy this table into an isolated or user Codex config only when S045 activates it.
[mcp_servers.armi_admin]
command = "armi-admin-mcp"
env_vars = ["ARMI_ADMIN_CONFIG"]
enabled_tools = ["advance_test_clock", "arm_fault", "clear_faults", "environment_initialize", "environment_reset", "environment_reset_preview", "health", "inject_creator_input", "inspect_scope", "run_test", "runtime_drain", "runtime_restart", "runtime_start", "runtime_status", "runtime_stop", "schema_status", "subject_snapshot", "tail_diagnostics", "trace_flow"]
required = true
default_tools_approval_mode = "auto"
startup_timeout_sec = 10
tool_timeout_sec = 30
