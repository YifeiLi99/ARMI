schema_version: armi.web-search-custody.v1
binding_id: armi.model-tool.volcengine-ark-web-search-v1
provider: volcengine_ark
model: doubao-seed-evolving
response_api_base: https://ark.cn-beijing.volces.com/api/v3
credential_identity: armi.model.ark-api-key.v1
credential_locator: model.ark_api_key
credential_purpose: web.search
purpose: public_web_research
operation_class: search_read_public
result_contract: armi.web-search-result.v1
store: false
production_cognition_tools: []
tool_actions:
  - search
  - open_page
  - find_in_page
tool_declaration:
  type: web_search
limits:
  canonical_request_bytes: 65536
  query_bytes: 16384
  max_result_bytes: 1048576
  max_tool_calls: 8
  max_citations: 128
  max_output_tokens: 1024
  max_cost_microyuan: 1000000
  step_timeout_seconds: 30
  total_timeout_seconds: 90
