[project]
name = "armi-runtime"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "armi-adapter-qq==0.0.0",
    "armi-kernel==0.0.0",
    "armi-postgresql-contract==0.0.0",
    "fastapi==0.140.13",
    "httpx==0.28.1",
    "openai==2.49.0",
    "openai-codex==0.144.4",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "pydantic==2.13.4",
    "rfc8785==0.1.4",
    "uvicorn==0.51.0",
]

[project.scripts]
armi = "armi_runtime.cli:main"
armi-codex-runner = "armi_runtime.codex_runner_cli:main"

[tool.uv.sources]
armi-adapter-qq = { workspace = true }
armi-kernel = { workspace = true }
armi-postgresql-contract = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.33,<0.12"]
build-backend = "uv_build"
