[project]
name = "armi-runtime"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.18.5",
    "armi-adapter-qq==0.0.0",
    "armi-artifact-store==0.0.0",
    "armi-capability==0.0.0",
    "armi-cognition==0.0.0",
    "armi-context==0.0.0",
    "armi-evidence==0.0.0",
    "armi-expression==0.0.0",
    "armi-interaction==0.0.0",
    "armi-kernel==0.0.0",
    "armi-opportunity==0.0.0",
    "armi-perception==0.0.0",
    "armi-postgresql-contract==0.0.0",
    "armi-runtime-foundation==0.0.0",
    "armi-relationship==0.0.0",
    "armi-memory==0.0.0",
    "armi-sleep==0.0.0",
    "armi-activity==0.0.0",
    "armi-material==0.0.0",
    "armi-subject-state==0.0.0",
    "armi-mood==0.0.0",
    "armi-prompt==0.0.0",
    "fastapi==0.140.13",
    "httpx==0.28.1",
    "openai==2.49.0",
    "openai-codex==0.144.4",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "pydantic==2.13.4",
    "rfc8785==0.1.4",
    "uvicorn==0.51.0",
]

[project.scripts]
armi = "armi_runtime.cli:main"
armi-codex-runner = "armi_runtime.codex_runner_cli:main"

[tool.uv.sources]
armi-adapter-qq = { workspace = true }
armi-artifact-store = { workspace = true }
armi-capability = { workspace = true }
armi-cognition = { workspace = true }
armi-context = { workspace = true }
armi-evidence = { workspace = true }
armi-expression = { workspace = true }
armi-kernel = { workspace = true }
armi-opportunity = { workspace = true }
armi-postgresql-contract = { workspace = true }
armi-runtime-foundation = { workspace = true }
armi-relationship = { workspace = true }
armi-memory = { workspace = true }
armi-sleep = { workspace = true }
armi-activity = { workspace = true }
armi-material = { workspace = true }
armi-subject-state = { workspace = true }
armi-mood = { workspace = true }
armi-prompt = { workspace = true }
armi-interaction = { workspace = true }
armi-perception = { workspace = true }

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/armi_runtime"]

[tool.hatch.build.targets.sdist.force-include]
"build/creator-web-resources" = "build/creator-web-resources"
"../../configs/runtime.yaml" = "src/armi_runtime/composition/runtime_resources/runtime.yaml"
"../../configs/model-bindings.yaml" = "src/armi_runtime/composition/runtime_resources/model-bindings.yaml"
"../../configs/web-search.yaml" = "src/armi_runtime/composition/runtime_resources/web-search.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/armi_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"build/creator-web-resources" = "armi_runtime/interfaces/creator_web_resources"
"../../configs/runtime.yaml" = "armi_runtime/composition/runtime_resources/runtime.yaml"
"../../configs/model-bindings.yaml" = "armi_runtime/composition/runtime_resources/model-bindings.yaml"
"../../configs/web-search.yaml" = "armi_runtime/composition/runtime_resources/web-search.yaml"
