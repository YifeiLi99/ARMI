[project]
name = "armi-runtime"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "armi-kernel==0.0.0",
    "fastapi==0.140.13",
    "openai==2.49.0",
    "playwright==1.61.0",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "pydantic==2.13.4",
    "rfc8785==0.1.4",
    "uvicorn==0.51.0",
]

[tool.uv.sources]
armi-kernel = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.33,<0.12"]
build-backend = "uv_build"
