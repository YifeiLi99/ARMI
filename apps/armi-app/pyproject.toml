[project]
name = "armi-app"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "armi-admin==0.0.0",
  "armi-runtime==0.0.0",
  "armi-local-control==0.0.0",
  "mcp==2.0.0",
  "pydantic==2.13.4",
  "jsonschema==4.26.0",
  "httpx==0.28.1",
]

[tool.uv.sources]
armi-admin = { workspace = true }
armi-runtime = { workspace = true }
armi-local-control = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.33,<0.12"]
build-backend = "uv_build"
